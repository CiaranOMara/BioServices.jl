# Julia workspace (Julia 1.12+) for the four prototype EBI Proteins clients, and the GGGenome and UMLS clients generated from hand-written descriptions over the shared ServiceRuntime.
# Each is its own package and can be loaded, tested and read without the others; they share this directory's Manifest.toml, so they always resolve to the same versions of their dependencies.
#
# BioServices itself is not in the workspace: it requires JSON 0.19–0.21, while EBIProteinsKwarg, EBIProteinsOpenAPI and EBIProteinsRestClient require JSON 1.x, so they cannot share one manifest.
#
#   julia --project=prototypes/EBIProteinsFunctions -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/EBIProteinsKwarg -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/EBIProteinsOpenAPI -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/EBIProteinsRestClient -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/ServiceRuntime -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/GGGenome -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/UMLS -e 'using Pkg; Pkg.instantiate(); Pkg.test()'   # live tests need ENV["UMLS_API_KEY"]
#
# Each package's src/ is generated by the generator in its gen/ directory; edit that, not the files in src/.
# common/ holds what the generators share: the spec snapshot and its parsing (spec.jl), the rendering helpers (render.jl), the runtime code the HTTP.jl clients share (runtime/), a driver that runs the EBIProteinsFunctions, EBIProteinsKwarg and EBIProteinsRestClient generators, and their environment.
# It is not a workspace member, because those generators run on JSON 0.21.
# EBIProteinsOpenAPI's generator needs OpenAPI.jl and JSON 1.x, so it has its own environment in EBIProteinsOpenAPI/gen/.
# ServiceGen/ generates GGGenome and UMLS from their gen/service.toml, for services that publish no OpenAPI spec; it is not a workspace member either, and runs on Julia 1.6 with only the standard library and SHA.
# Their src/ is generated too, and ServiceRuntime, which they depend on, is written by hand.
# workflows/ holds the spec drift and smoke workflows; copy them to .github/workflows to enable them.
[workspace]
projects = ["EBIProteinsFunctions", "EBIProteinsKwarg", "EBIProteinsOpenAPI", "EBIProteinsRestClient", "GGGenome", "ServiceRuntime", "UMLS"]
