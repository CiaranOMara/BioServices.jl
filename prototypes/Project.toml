# Julia workspace (Julia 1.12+) for the two prototype EBI Proteins clients.
# Each is its own package and can be loaded, tested and read without the other; they share this directory's Manifest.toml, so they always resolve to the same versions of their dependencies.
#
# BioServices itself is not in the workspace: it requires JSON 0.19–0.21, while EBIProteinsOpenAPI requires JSON 1.x, so they cannot share one manifest.
#
#   julia --project=prototypes/EBIProteinsFunctions -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#   julia --project=prototypes/EBIProteinsOpenAPI -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
#
# Each package's src/ is generated by the generator in its gen/ directory; edit that, not the files in src/.
# common/ holds what the generators share: the spec snapshot, spec parsing, a driver that runs the EBIProteinsFunctions generator, and its environment.
# It is not a workspace member, because that generator runs on JSON 0.21.
# EBIProteinsOpenAPI's generator needs OpenAPI.jl and JSON 1.x, so it has its own environment in EBIProteinsOpenAPI/gen/.
[workspace]
projects = ["EBIProteinsFunctions", "EBIProteinsOpenAPI"]
