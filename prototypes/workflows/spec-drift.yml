# Detect changes to the EBI Proteins OpenAPI spec.
#
# Kept here with the prototypes; GitHub only runs workflows in .github/workflows, so copy this file there to enable it.
#
# Fetches the live spec, normalises it (sorted keys, so reordering is not drift), regenerates the three prototype clients in prototypes/ and, if anything changed, opens or updates one PR from the branch spec-drift/ebiproteins.
#
# The branch is pushed over SSH with the DOCUMENTER_KEY deploy key (the key CompatHelper and TagBot already use), because pushes made with GITHUB_TOKEN do not trigger other workflows.
# The SSH push triggers ci.yml's `push` run, whose status shows on the PR.
# GITHUB_TOKEN is used only to open the PR, which requires "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
#
# If regeneration fails (for example the spec gains a defect prototypes/common/shared.jl does not patch), the job opens or comments on an issue instead.
name: Spec drift
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:
permissions: {}
concurrency:
  group: spec-drift
  cancel-in-progress: false
jobs:
  ebiproteins:
    name: EBI Proteins
    runs-on: ubuntu-latest
    permissions:
      contents: read # the branch is pushed with the deploy key, not GITHUB_TOKEN
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.DOCUMENTER_KEY }}
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Fetch spec and regenerate
        run: |
          julia --project=prototypes/common -e 'using Pkg; Pkg.instantiate()'
          julia --project=prototypes/common prototypes/common/generate.jl --fetch
          julia --project=prototypes/EBIProteinsOpenAPI/gen -e 'using Pkg; Pkg.instantiate()'
          julia --project=prototypes/EBIProteinsOpenAPI/gen prototypes/EBIProteinsOpenAPI/gen/generate.jl
      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: spec-drift/ebiproteins
          delete-branch: true
          add-paths: |
            prototypes/common/openapi.json
            prototypes/EBIProteinsFunctions/src/EBIProteinsFunctions.jl
            prototypes/EBIProteinsKwarg/src/EBIProteinsKwarg.jl
            prototypes/EBIProteinsOpenAPI/src/EBIProteinsOpenAPI.jl
          commit-message: Update EBI Proteins spec snapshot and regenerate client
          title: EBI Proteins API spec changed
          body: |
            The live spec at https://www.ebi.ac.uk/proteins/api/openapi.json no longer matches `prototypes/common/openapi.json`.
            This PR updates the snapshot and regenerates the `EBIProteinsFunctions`, `EBIProteinsKwarg` and `EBIProteinsOpenAPI` sources in `prototypes/`.

            Review the spec diff for removed or renamed operations and parameters: those are breaking changes for users of the generated clients.

            Opened by the [Spec drift workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="EBI Proteins spec drift check failed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The spec drift workflow failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
